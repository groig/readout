# Readout: app + Postgres. Copy into the infra repo and adapt.
#
# Caddy (already in our infra) terminates TLS and proxies to app:4000. See
# deploy/Caddyfile.example for the site block, including the tailnet-only
# rule for /dev/*.
#
#   cp .env.example .env    # fill in secrets
#   docker compose -f compose.example.yml up -d --pull always

name: readout

services:
  app:
    # Deploy the digest you reviewed, not a moving tag:
    #   image: ghcr.io/groig/readout@sha256:<digest>
    image: ghcr.io/groig/readout:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ecto://readout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/readout
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE (mix phx.gen.secret)}
      PHX_HOST: ${PHX_HOST:-share.example.com}
      STORAGE_PATH: /data/storage
      # Email (optional; without it invitations are copyable links and links
      # can't require email verification).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-infra@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Readout}
      # Optional
      GEOIP_DB_PATH: /data/geoip/city.mmdb
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Proxies allowed to set X-Forwarded-For / -Proto: Caddy's address only
      # (e.g. 172.20.0.2/32, or the proxy network's subnet). Anything broader
      # lets other containers forge client addresses.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set TRUSTED_PROXIES to Caddy's address}
      # First-run setup: whoever opens /setup on an empty database becomes the
      # owner, so it asks for this code (openssl rand -hex 16). Without it,
      # only ADMIN_NETWORKS can reach setup; with neither, setup is locked.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Networks allowed to reach setup and workspace/members/audit settings
      # (e.g. the tailnet: 100.64.0.0/10,fd7a:115c:a1e0::/48).
      ADMIN_NETWORKS: ${ADMIN_NETWORKS:-}
      # Document tools run in their own namespaces (no network, hidden
      # storage) and refuse to run without them. See security_opt below.
      TOOL_ISOLATION: required
    volumes:
      - storage:/data/storage
      # Optional GeoIP database (DB-IP Lite City, CC BY 4.0). See README.
      - ./geoip:/data/geoip:ro
    # Not published: only Caddy talks to the app. For a quick local try,
    # uncomment:
    # ports:
    #   - "127.0.0.1:4000:4000"
    networks: [readout, proxy]
    # Containment: no capabilities, no privilege escalation, bounded memory
    # and processes. The seccomp profile is Docker's default plus the
    # namespace calls document tools need for their isolation (unshare,
    # mount and the new mount API); see deploy/seccomp.json.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp.json
      # On AppArmor hosts (Debian, Ubuntu) docker-default denies mount:
      # - apparmor=unconfined
    mem_limit: ${APP_MEMORY:-4g}
    pids_limit: 512

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: readout
      POSTGRES_USER: readout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readout -d readout"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [readout]

volumes:
  storage:
  db:

networks:
  readout:
  # The network Caddy is attached to.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
